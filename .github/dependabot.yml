version: 2
updates:
  # Go modules: security notices and version updates for direct dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    # Group minor and patch updates to reduce the number of pull requests.
    # Use a separate pull request for each major update. Check it against the
    # dependency policy in README: 10 direct dependencies, with written reasons
    # for each addition.
    groups:
      go-patches:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: update action versions for security fixes and new features.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
