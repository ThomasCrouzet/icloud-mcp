name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fuzz:
        description: Run random fuzz exploration
        required: false
        default: false
        type: boolean
      registry:
        description: Verify the published registry state after publication
        required: false
        default: false
        type: boolean
      native:
        description: Run native release archive smoke checks
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: gofmt / vet / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The public-text check reads the commits in the pull request or push.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      - name: public text policy
        shell: bash
        run: |
          status=0
          non_ascii=$'[^\t -~]'
          automated_attribution='^[[:space:]]*Co-Authored-By[[:space:]]*:.*(claude|anthropic|openai|chatgpt|codex|copilot|gemini|gpt|assistant|language[[:space:]]+model|automation[[:space:]]+bot)'
          provenance_signature='^[[:space:]#*/;>-]*(Auto[ -]?)?(Generated|Assisted)[ -]By[[:space:]:]'
          policy_pattern="(${automated_attribution})|(${provenance_signature})"
          while IFS= read -r -d '' file; do
            if LC_ALL=C grep -nH "$non_ascii" "$file"; then
              echo "Non-ASCII content in public text: $file" >&2
              status=1
            fi
          done < <(git ls-files -z -- '*.md' '*.yml' '*.yaml' '*.example' '*.txt' \
            'Makefile' 'LICENSE*' 'NOTICE*' 'THIRD_PARTY*' 'go.mod' 'go.sum' \
            '.gitignore' '.golangci.yml')

          if git grep -niE "$policy_pattern"; then
            echo "Forbidden automated attribution found in tracked tree" >&2
            status=1
          fi

          # New commits on this ref must stay English ASCII without automated trailers.
          # Do not rewrite older commits on main.
          range=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              range="${before}..${{ github.sha }}"
            else
              range="${{ github.sha }}^!"
            fi
          fi
          if [ -n "$range" ]; then
            while IFS= read -r commit; do
              [ -z "$commit" ] && continue
              body="$(git log -1 --format=%B "$commit")"
              if printf '%s' "$body" | LC_ALL=C grep -nE "$non_ascii"; then
                echo "Non-ASCII commit message: $commit" >&2
                status=1
              fi
              if printf '%s' "$body" | grep -niE "$policy_pattern"; then
                echo "Forbidden automated attribution in commit $commit" >&2
                status=1
              fi
            done < <(git rev-list --no-merges "$range" 2>/dev/null || true)
          fi
          exit "$status"

      - name: Cache lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: lint-${{ runner.os }}-${{ runner.arch }}-go1.27.3-v2.15.0-${{ hashFiles('go.sum', '.golangci.yml') }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        env:
          GOTOOLCHAIN: go1.27.3
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        with:
          version: v2.15.0
          args: --timeout=5m ./...
          skip-cache: true

      - name: go test (race + coverprofile)
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

      - name: executable and in-process protocol evidence
        run: |
          python3 scripts/protocol_evidence.py --output "${RUNNER_TEMP}/protocol-evidence"
          python3 scripts/protocol_evidence.py --merge-coverage coverage.out \
            coverage.out "${RUNNER_TEMP}/protocol-evidence/executable-coverage.out"

      - name: coverage threshold
        run: bash scripts/check_coverage.sh coverage.out

      - name: govulncheck (go.mod vulnerabilities)
        run: |
          # Use a fixed version to prevent unexpected CI changes from @latest.
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: build (linux/amd64 + linux/arm64 + darwin/arm64 + windows/amd64 smoke)
        run: |
          mkdir -p dist
          version="v$(jq -r .version server.json)-ci"
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/icloud-mcp-$os-$arch"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "::group::build $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${version}" \
              -o "$out" ./cmd/icloud-mcp
            file "$out"
            if [ "$target" = "linux/amd64" ]; then
              test "$("$out" -version)" = "$version"
            fi
            echo "::endgroup::"
          done

      - name: mod verify and tidy
        run: |
          go mod verify
          go mod tidy -diff

      - name: fuzz smoke
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.fuzz)
        run: |
          set -e
          # Keep at least one native fuzz target in each protocol parser package.
          # Retry once. A short -fuzztime check can fail when the Go coordinator stops.
          # This can return "context deadline exceeded" without a crash corpus.
          run_one_fuzz() {
            package="$1"
            target="$2"
            if go test "$package" -run=^$ -fuzz="^${target}$" -fuzztime=5s -timeout=2m; then
              return 0
            fi
            echo "fuzz $package $target failed once; retrying once" >&2
            go test "$package" -run=^$ -fuzz="^${target}$" -fuzztime=5s -timeout=2m
          }
          run_fuzz_targets() {
            package="$1"
            targets="$(go test "$package" -list '^Fuzz' | awk '/^Fuzz[[:alnum:]_]+$/ { print }')"
            if [ -z "$targets" ]; then
              echo "Required fuzz target missing in $package" >&2
              return 1
            fi
            for target in $targets; do
              echo "::group::fuzz $package $target"
              run_one_fuzz "$package" "$target"
              echo "::endgroup::"
            done
          }
          run_fuzz_targets ./internal/icloud/
          run_fuzz_targets ./internal/security/
          run_fuzz_targets ./internal/contacts/
          run_fuzz_targets ./internal/mail/
          run_fuzz_targets ./internal/mail/imapadapter/

      - name: security guardrails
        run: python3 scripts/security_guards.py .

      - name: documentation consistency
        run: make check-docs

      - name: platform claim consistency
        run: make check-platforms

      - name: binary size budget (linux/arm64)
        run: |
          # Static stripped arm64 binary should stay under 20 MiB.
          SIZE=$(wc -c < dist/icloud-mcp-linux-arm64)
          echo "linux/arm64 size: $SIZE bytes"
          if [ "$SIZE" -gt 20971520 ]; then
            echo "binary exceeds 20 MiB budget"
            exit 1
          fi

  release-metadata:
    name: release metadata
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.native)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate local release metadata
        run: make check-release-metadata

      - name: Test release metadata checks
        run: python3 -m unittest scripts/test_check_release.py

  # Publication follows the tag and requires a manual maintainer step. Keep
  # registry verification separate so a pending release does not fail main.
  published-registry:
    name: published registry verification
    if: github.event_name == 'workflow_dispatch' && inputs.registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check published registry state
        run: make check-registry

  native-release-smoke:
    name: native release smoke
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.native)
    needs: [ci, secrets, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            asset_os: linux
            asset_arch: arm64
          - runner: macos-15
            asset_os: darwin
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${{ github.ref_name }}"
          else
            version="v$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build signed-shape archives and checksums
        run: make release-all VERSION="${{ steps.version.outputs.value }}"

      - name: Extract and start the native archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          archive="icloud-mcp-${VERSION}-${ASSET_OS}-${ASSET_ARCH}.tar.gz"
          checksums="icloud-mcp-${VERSION}-checksums.txt"
          test -f "dist/$archive"
          (cd dist && shasum -a 256 -c "$checksums")
          mkdir native-smoke
          tar -xzf "dist/$archive" -C native-smoke
          python3 scripts/native_smoke.py \
            --binary native-smoke/icloud-mcp \
            --version "$VERSION" \
            --tools 7

  # Tag releases only after CI and secret scan succeed on the same ref.
  release:
    name: build archives and checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, secrets, release-metadata, native-release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: false

      - name: Validate release metadata and extract notes
        run: |
          make check-release-metadata
          python3 scripts/check_release.py metadata --tag "$GITHUB_REF_NAME" \
            --notes-out "$RUNNER_TEMP/release-notes.md"

      - name: Build multi-arch archives
        # Host Go is pinned above for release builds. Local `make release` remains
        # the digest-pinned container path for linux/arm64 only.
        run: make release-all VERSION="$GITHUB_REF_NAME"

      - name: Cosign keyless signatures
        # Sign before publication. If Fulcio or Rekor fails, do not publish an unsigned GitHub Release.
        run: |
          set -euo pipefail
          VERSION=2.4.1
          EXPECTED_SHA256=8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
          binary="${RUNNER_TEMP}/cosign"
          curl -fsSL -o "$binary" \
            "https://github.com/sigstore/cosign/releases/download/v${VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$binary" | sha256sum -c -
          chmod +x "$binary"
          cd dist
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          files=(icloud-mcp-"$tag"-*.tar.gz icloud-mcp-"$tag"-checksums.txt)
          test "${#files[@]}" -eq 4
          for f in "${files[@]}"; do
            "$binary" sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Create GitHub Release with checksums and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          assets=(
            "dist/icloud-mcp-${tag}-linux-amd64.tar.gz"
            "dist/icloud-mcp-${tag}-linux-arm64.tar.gz"
            "dist/icloud-mcp-${tag}-darwin-arm64.tar.gz"
            "dist/icloud-mcp-${tag}-checksums.txt"
          )
          signatures=(dist/icloud-mcp-"$tag"-*.sig)
          certificates=(dist/icloud-mcp-"$tag"-*.pem)
          test "${#signatures[@]}" -eq 4
          test "${#certificates[@]}" -eq 4
          assets+=("${signatures[@]}" "${certificates[@]}")
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --title "$GITHUB_REF_NAME" \
            "${assets[@]}"

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          # The official gitleaks binary needs no license for private or public repositories.
          # This differs from gitleaks-action@v2.
          # Scan Git history and the current worktree. Keep inline "gitleaks:allow" annotations.
          VERSION=8.30.1
          EXPECTED_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          # These fingerprints identify old test values committed before their lines had gitleaks:allow annotations.
          # Limit each exception to its commit, path, rule, and line.
          # Every new finding must fail the check.
          ignore="${RUNNER_TEMP}/.gitleaksignore"
          cat >"$ignore" <<'EOF'
          253a3b79789474cb957af5ca820bb5f5dbc46c0c:internal/security/redact_test.go:generic-api-key:22
          7c910002127d74ea3b39fdd1eca571d14a9c65c0:internal/security/redact_test.go:generic-api-key:67
          7c910002127d74ea3b39fdd1eca571d14a9c65c0:internal/security/redact_test.go:generic-api-key:86
          7c910002127d74ea3b39fdd1eca571d14a9c65c0:internal/mcptools/redaction_test.go:generic-api-key:166
          7c910002127d74ea3b39fdd1eca571d14a9c65c0:internal/mcptools/redaction_test.go:generic-api-key:198
          7c910002127d74ea3b39fdd1eca571d14a9c65c0:internal/mcptools/redaction_test.go:generic-api-key:350
          EOF
          "${RUNNER_TEMP}/gitleaks" git --log-opts="--all" --gitleaks-ignore-path "$ignore" --redact --verbose
          "${RUNNER_TEMP}/gitleaks" dir . --gitleaks-ignore-path "$ignore" --redact --verbose
