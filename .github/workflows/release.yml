name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build archives and checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          check-latest: true

      - name: Build multi-arch archives
        # release-all rejects a dirty tree; the tag checkout is clean.
        run: make release-all VERSION=${GITHUB_REF_NAME}

      - name: Create GitHub Release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "dist/icloud-mcp-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            "dist/icloud-mcp-${GITHUB_REF_NAME}-linux-arm64.tar.gz" \
            "dist/icloud-mcp-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" \
            "dist/icloud-mcp-${GITHUB_REF_NAME}-checksums.txt"

      - name: Optional cosign keyless signatures
        # Best-effort SLSA-style blob signatures. Archives and SHA-256 checksums
        # remain the primary verification path when cosign is unavailable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pin cosign v2.4.1 linux/amd64 binary (cosign_checksums.txt upstream).
          VERSION=2.4.1
          EXPECTED_SHA256=8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
          binary="${RUNNER_TEMP}/cosign"
          curl -fsSL -o "$binary" \
            "https://github.com/sigstore/cosign/releases/download/v${VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$binary" | sha256sum -c -
          chmod +x "$binary"
          cd dist
          for f in icloud-mcp-${GITHUB_REF_NAME}-*.tar.gz \
                   icloud-mcp-${GITHUB_REF_NAME}-checksums.txt; do
            "$binary" sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          gh release upload "$GITHUB_REF_NAME" ./*.sig ./*.pem --clobber
